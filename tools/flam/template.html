<!doctype html>
<meta charset="utf-8">
<title>flam</title>
<style>
  :root {
    --bg: #14161a; --fg: #e7e9ee; --dim: #878d9b; --line: #2a2e37;
    --early: #5aa9e6; --late: #e6725a; --exact: #6bbf78;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  main { max-width: 900px; margin: 0 auto; padding: 24px 20px 48px; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
  .sub { color: var(--dim); margin: 0 0 20px; word-break: break-all; }
  .row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  button { font: inherit; background: #222732; color: var(--fg); border: 1px solid var(--line);
           border-radius: 5px; padding: 6px 14px; cursor: pointer; }
  button:hover { border-color: #3d4453; }
  button[disabled] { opacity: .45; cursor: default; }
  label { color: var(--dim); display: flex; gap: 7px; align-items: center; }
  input[type=range] { accent-color: var(--early); }
  canvas { width: 100%; height: 132px; display: block; border: 1px solid var(--line);
           border-radius: 6px; background: #101217; }
  .scrub { width: 100%; margin: 12px 0 4px; accent-color: var(--dim); }
  table { border-collapse: collapse; margin-top: 22px; font-size: 12px; }
  td, th { padding: 3px 16px 3px 0; text-align: right; }
  th { color: var(--dim); font-weight: 400; }
  td:first-child, th:first-child { text-align: left; }
  .legend { color: var(--dim); font-size: 12px; margin-top: 10px; }
  .k { display: inline-block; width: 9px; height: 9px; border-radius: 2px; vertical-align: -1px; }
</style>

<main>
  <h1>two-click flam</h1>
  <p class="sub" id="title"></p>

  <div class="row">
    <button id="play">play</button>
    <button id="stop" disabled>stop</button>
    <label>speed
      <input type="range" id="speed" min="0.25" max="1" step="0.05" value="1">
      <span id="speedOut">1.00x</span>
    </label>
    <label><input type="checkbox" id="ref" checked> reference click</label>
    <label><input type="checkbox" id="tap" checked> your tap</label>
  </div>

  <canvas id="plot"></canvas>
  <input type="range" class="scrub" id="scrub" min="0" max="1000" value="0">

  <p class="legend">
    <span class="k" style="background:var(--early)"></span> early, panned left and pitched down &nbsp;
    <span class="k" style="background:var(--late)"></span> late, panned right and pitched up &nbsp;
    <span class="k" style="background:var(--exact)"></span> inside a quarter of the great window
  </p>

  <table id="stats"></table>
</main>

<script>
const DATA = "__FLAM_DATA__";

const $ = id => document.getElementById(id);
const objects = DATA.objects;
const judged = objects.filter(o => o.err !== null);
const lastTime = objects.length ? objects[objects.length - 1].t + 2000 : 0;

$("title").textContent = DATA.replay;

// ---- summary ------------------------------------------------------------
const mean = judged.reduce((s, o) => s + o.err, 0) / (judged.length || 1);
const sd = Math.sqrt(judged.reduce((s, o) => s + (o.err - mean) ** 2, 0) / (judged.length || 1));
const counts = objects.reduce((m, o) => (m[o.result] = (m[o.result] || 0) + 1, m), {});
$("stats").innerHTML =
  `<tr><th>clicks</th><th>mean error</th><th>unstable rate</th><th>rate</th><th>judgements</th></tr>` +
  `<tr><td>${objects.length}</td><td>${mean >= 0 ? "+" : ""}${mean.toFixed(1)} ms</td>` +
  `<td>${(sd * 10).toFixed(1)}</td><td>${DATA.rate.toFixed(2)}x</td>` +
  `<td>${Object.entries(counts).map(([k, v]) => `${k} ${v}`).join(", ")}</td></tr>`;

// ---- plot ---------------------------------------------------------------
const canvas = $("plot"), ctx = canvas.getContext("2d");
const meh = DATA.hitWindows.meh, great = DATA.hitWindows.great;

function colourFor(err) {
  if (Math.abs(err) <= great / 4) return getComputedStyle(document.body).getPropertyValue("--exact");
  return err < 0 ? "#5aa9e6" : "#e6725a";
}

function draw(playhead) {
  const w = canvas.width = canvas.clientWidth * devicePixelRatio;
  const h = canvas.height = 132 * devicePixelRatio;
  ctx.clearRect(0, 0, w, h);

  const mid = h / 2, scale = (h / 2 - 8) / meh;

  ctx.strokeStyle = "#2a2e37"; ctx.lineWidth = devicePixelRatio;
  for (const edge of [great, DATA.hitWindows.ok]) {
    for (const sign of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(0, mid + sign * edge * scale);
      ctx.lineTo(w, mid + sign * edge * scale);
      ctx.stroke();
    }
  }
  ctx.strokeStyle = "#3d4453";
  ctx.beginPath(); ctx.moveTo(0, mid); ctx.lineTo(w, mid); ctx.stroke();

  for (const o of judged) {
    ctx.fillStyle = colourFor(o.err);
    const x = (o.t / lastTime) * w;
    ctx.fillRect(x, mid + o.err * scale - devicePixelRatio, 2 * devicePixelRatio, 2 * devicePixelRatio);
  }

  if (playhead != null) {
    ctx.strokeStyle = "#e7e9ee";
    const x = (playhead / lastTime) * w;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
  }
}
draw(0);
addEventListener("resize", () => draw(playPos()));

// ---- audio --------------------------------------------------------------
// Everything is synthesised. Two voices: a flat reference click on the object time and a
// tap click on the hit time, pitched and panned by the sign of the error so early and late
// separate without having to think about it.
let audio = null, startedAt = 0, originMs = 0, timer = null, cursor = 0, running = false;

function click(at, freq, gainValue, pan) {
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  const panner = audio.createStereoPanner();

  osc.type = "square";
  osc.frequency.value = freq;
  panner.pan.value = pan;

  gain.gain.setValueAtTime(0.0001, at);
  gain.gain.exponentialRampToValueAtTime(gainValue, at + 0.001);
  gain.gain.exponentialRampToValueAtTime(0.0001, at + 0.028);

  osc.connect(gain).connect(panner).connect(audio.destination);
  osc.start(at);
  osc.stop(at + 0.035);
}

// Held rather than read from the input, because a speed change has to rebase the timeline
// using the speed that was in force up to that moment, not the new one.
let rate = parseFloat($("speed").value);

const playPos = () => running ? originMs + (audio.currentTime - startedAt) * 1000 * rate : originMs;

function schedule() {
  const horizon = playPos() + 250;

  while (cursor < objects.length && objects[cursor].t <= horizon) {
    const o = objects[cursor++];
    const when = t => startedAt + (t - originMs) / 1000 / rate;

    if ($("ref").checked && o.t >= originMs)
      click(when(o.t), 880, 0.12, -0.15);

    if ($("tap").checked && o.err !== null && o.hit >= originMs) {
      // A semitone and a half of detune per great-window of error is enough to hear the
      // direction instantly and small enough that it never sounds like a different sound.
      const skew = Math.max(-1, Math.min(1, o.err / meh));
      click(when(o.hit), 1320 * (1 + 0.18 * skew), 0.16, 0.35 * Math.sign(o.err || 1));
    }
  }

  draw(playPos());

  if (playPos() > lastTime) stop();
}

function start() {
  audio ||= new AudioContext();
  audio.resume();
  originMs = (parseInt($("scrub").value, 10) / 1000) * lastTime;
  cursor = objects.findIndex(o => o.t >= originMs);
  if (cursor < 0) cursor = objects.length;
  startedAt = audio.currentTime + 0.1;
  running = true;
  $("play").disabled = true; $("stop").disabled = false;
  timer = setInterval(schedule, 25);
}

function stop() {
  clearInterval(timer);
  running = false;
  $("play").disabled = false; $("stop").disabled = true;
  if (audio) audio.close();
  audio = null;
  draw(originMs);
}

$("play").onclick = start;
$("stop").onclick = stop;
$("speed").oninput = () => {
  // Rebase before adopting the new rate, or the playhead jumps by however far the old rate
  // had carried it. Clicks already queued inside the lookahead keep the old spacing, which
  // is a few notes of overlap and not worth tearing down the graph for.
  if (running) { originMs = playPos(); startedAt = audio.currentTime; }
  rate = parseFloat($("speed").value);
  $("speedOut").textContent = rate.toFixed(2) + "x";
};
$("scrub").oninput = () => { if (!running) { originMs = (parseInt($("scrub").value, 10) / 1000) * lastTime; draw(originMs); } };
addEventListener("keydown", e => {
  if (e.code === "Space") { e.preventDefault(); running ? stop() : start(); }
});
</script>
